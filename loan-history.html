<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>লোন হিস্ট্রি - বিকাশ লোন</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', 'SutonnyMJ', sans-serif;
            background: #f5f5f5;
        }
        .header {
            background: #d32f2f;
            color: white;
            padding: 15px 20px;
        }
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon {
            width: 40px;
            height: 40px;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: bold;
            color: #d32f2f;
        }
        .nav-menu a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .logout-btn {
            background: white;
            color: #d32f2f;
            border: none;
            padding: 6px 15px;
            border-radius: 20px;
            cursor: pointer;
        }
        .main-content {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .section-card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }
        .section-title {
            color: #d32f2f;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .loan-item {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            border-left: 5px solid #d32f2f;
        }
        .loan-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-approved { background: #4caf50; color: white; }
        .status-pending { background: #ff9800; color: white; }
        .status-rejected { background: #f44336; color: white; }
        @media (max-width: 768px) {
            .header-content { flex-direction: column; gap: 10px; text-align: center; }
            .nav-menu { margin: 10px 0; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <div class="logo-area">
                <div class="logo-icon">বি</div>
                <div style="font-size: 20px; font-weight: bold;">বিকাশ লোন</div>
            </div>
            <div class="nav-menu">
                <a href="dashboard.html">হোম</a>
                <a href="loan-history.html" style="font-weight: bold;">লোন হিস্টরি</a>
                <a href="profile.html">প্রোফাইল</a>
            </div>
            <div class="user-info">
                <span id="userName">লোডিং...</span>
                <button class="logout-btn" onclick="logout()">লগআউট</button>
            </div>
        </div>
    </div>
    <div class="main-content">
        <div class="section-card">
            <div class="section-title">📜 লোন হিস্টরি</div>
            <div id="loanList">লোড হচ্ছে...</div>
        </div>
    </div>
    <script type="module">
        import { auth, db } from './firebase.js';
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js";
        import { collection, query, where, getDocs, orderBy } from "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js";
        
        onAuthStateChanged(auth, async (user) => {
            if (!user) { window.location.href = 'index.html'; return; }
            document.getElementById('userName').textContent = user.email.split('@')[0];
            await loadLoans(user.uid);
        });
        
        async function loadLoans(userId) {
            const q = query(collection(db, 'loans'), where('userId', '==', userId), orderBy('timestamp', 'desc'));
            const querySnapshot = await getDocs(q);
            const loanList = document.getElementById('loanList');
            if (querySnapshot.empty) {
                loanList.innerHTML = '<p style="text-align:center;">কোনো লোনের ইতিহাস নেই</p>';
                return;
            }
            let html = '';
            querySnapshot.forEach(doc => {
                const data = doc.data();
                const date = data.timestamp?.toDate().toLocaleDateString('bn-BD') || 'তারিখ নেই';
                html += `
                    <div class="loan-item">
                        <div style="display: flex; justify-content: space-between; flex-wrap: wrap;">
                            <div><strong>💰 ${data.amount?.toLocaleString()} টাকা</strong></div>
                            <div><span class="loan-status status-${data.status === 'approved' ? 'approved' : 'pending'}">${data.status === 'approved' ? 'অনুমোদিত' : 'বিচারাধীন'}</span></div>
                        </div>
                        <div style="font-size: 14px; color: #666; margin-top: 10px;">
                            📅 আবেদন: ${date}<br>
                            📆 মেয়াদ: ${data.duration} মাস | কিস্তি: ${data.emi?.toLocaleString()} টাকা/মাস
                        </div>
                    </div>
                `;
            });
            loanList.innerHTML = html;
        }
        
        window.logout = async () => { await signOut(auth); window.location.href = 'index.html'; };
    </script>
</body>
</html>
